  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003ctitle\u003eBermudAir — Where We Fly\u003c/title\u003e\n\n\u003cstyle\u003e/* ============================================================\n   BermudAir — Web fonts\n   Open Sauce Sans  → primary sans (brand wordmark + UI + body)\n   Source Serif 4   → SUBSTITUTE for Kepler (licensed Adobe serif).\n                      Source Serif 4 is Adobe\u0027s open-source transitional\n                      serif in the same 18th-century tradition as Kepler.\n                      Swap in the licensed Kepler webfonts when available.\n   All files self-hosted from /assets/fonts (OFL-1.1).\n   ============================================================ */\n\n/* ---------- Open Sauce Sans ---------- */\n@font-face {\n  font-family: \"Open Sauce Sans\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"28edcf86-6f1a-4ca6-831d-4d9876adb591\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Open Sauce Sans\";\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7650f578-7401-4e8d-b5ef-60d4a37d2c8a\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Open Sauce Sans\";\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"5edfe74a-9acb-4957-bb6e-9ba1ac65df87\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Open Sauce Sans\";\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f25b3762-5739-4c14-a228-92ad7d8d2caf\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Open Sauce Sans\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"af0ec005-4193-4a28-93ea-a3b18105de39\") format(\"woff2\");\n}\n\n/* ---------- Open Sauce One ----------\n   The 2026 Figma names the body face \"Open Sauce One\". It is the same\n   open Open Sauce superfamily already self-hosted here as \"Open Sauce\n   Sans\" (OFL-1.1), so we register the \"Open Sauce One\" family name\n   against those same self-hosted woff2 cuts. Drop in the exact\n   Open Sauce One woff2 files to replace these src URLs when available. */\n@font-face {\n  font-family: \"Open Sauce One\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"28edcf86-6f1a-4ca6-831d-4d9876adb591\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Open Sauce One\";\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7650f578-7401-4e8d-b5ef-60d4a37d2c8a\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Open Sauce One\";\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"5edfe74a-9acb-4957-bb6e-9ba1ac65df87\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Open Sauce One\";\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f25b3762-5739-4c14-a228-92ad7d8d2caf\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Open Sauce One\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"af0ec005-4193-4a28-93ea-a3b18105de39\") format(\"woff2\");\n}\n\n/* ---------- Source Serif 4 (Kepler substitute) ---------- */\n@font-face {\n  font-family: \"Source Serif 4\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"abc68c34-62e8-4f43-8806-8d788489d1e1\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Source Serif 4\";\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"6a7bc3f1-dffe-4869-9f61-d2818f4957bf\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Source Serif 4\";\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e7c1fdc3-9312-46cd-aa9e-2d43062a937a\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Source Serif 4\";\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"50bc84f0-db52-4598-bff5-160136e5273d\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Source Serif 4\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2a4474be-7b2b-44e7-bde3-0734cd77c089\") format(\"woff2\");\n}\n\u003c/style\u003e\n\u003cstyle\u003e/* ============================================================\n   BermudAir — Colour tokens  ·  v2 (2026 website evolution)\n   Reconciled with the Figma \"Colours\" Variable collection.\n   Evolution vs v1:\n     • Bermuda Pink deepens to #DC287F and becomes the PRIMARY CTA.\n     • New warm surfaces: Off-White #F9F9F5 and Cream #F1F0E4.\n     • Neutrals move from blue-tinted to TRUE neutral greys.\n     • State colours adopt the Figma \"warnings\" set.\n   Legacy alias names (--ink-*, --neutral-*, --action-*, …) are\n   preserved and re-pointed so existing components inherit the\n   new look automatically.\n   ============================================================ */\n:root {\n  /* ---------- Primary · Deep Sea Blue ---------- */\n  --deep-sea-blue:        #125891;\n  --deep-sea-blue-70:     #5a8ab2;\n  --deep-sea-blue-50:     #88abc8;\n  --deep-sea-blue-30:     #b7cdde;\n  --deep-sea-blue-15:     #dce6ef;\n\n  /* ---------- Primary · Ocean Blue (the iconic \u0027A\u0027) ---------- */\n  --ocean-blue:           #12d4d9;\n  --ocean-blue-70:        #5ae1e4;\n  --ocean-blue-50:        #88e9ec;\n  --ocean-blue-30:        #b7f2f4;\n  --ocean-blue-15:        #dcf9f9;\n\n  /* ---------- Primary · Sky Blue (Ocean Blue tint) ---------- */\n  --sky-blue:             #d0f6f7;\n\n  /* ---------- Secondary · Bermuda Pink (PRIMARY CTA) ---------- */\n  --bermuda-pink:         #dc287f;   /* deepened in the evolution */\n  --bermuda-pink-70:      #ee3890;   /* the v1 pink, now a tint   */\n  --bermuda-pink-50:      #f69bc7;\n  --bermuda-pink-30:      #fac3dd;\n  --bermuda-pink-15:      #fce1ee;\n\n  /* ---------- Secondary · Swizzle Orange ---------- */\n  --swizzle-orange:       #ff8500;\n  --swizzle-orange-70:    #ffaa4d;\n  --swizzle-orange-50:    #ffc27f;\n  --swizzle-orange-30:    #ffdab2;\n  --swizzle-orange-15:    #ffedd9;\n\n  /* ---------- Brand surfaces ---------- */\n  --white:                #ffffff;\n  --off-white:            #f9f9f5;   /* warm page / section tint  */\n  --cream:                #f1f0e4;   /* editorial accent surface  */\n\n  /* ---------- Neutrals · true neutral grey ladder ----------\n     From the Figma \"greys/*\" tokens. Replaces the v1 blue-tinted\n     greys so chrome reads clean and quiet under the brand colour. */\n  --grey-50:              #f6f6f6;\n  --grey-100:             #e7e7e7;\n  --grey-200:             #d1d1d1;\n  --grey-300:             #b0b0b0;\n  --grey-400:             #888888;\n  --grey-500:             #6d6d6d;\n  --grey-600:             #5d5d5d;   /* body copy default         */\n  --grey-700:             #4f4f4f;\n  --grey-800:             #454545;\n  --grey-900:             #3d3d3d;   /* primary text / headings   */\n  --grey-black:           #000000;\n\n  /* ---------- Legacy neutral aliases (re-pointed) ---------- */\n  --ink-900:              var(--grey-900);  /* primary text       */\n  --ink-700:              var(--grey-600);  /* secondary / body   */\n  --ink-500:              var(--grey-400);  /* muted / captions   */\n  --ink-300:              var(--grey-300);  /* disabled           */\n  --neutral-100:          var(--grey-100);  /* hairline borders   */\n  --neutral-50:           var(--grey-50);   /* fills / tint       */\n  --neutral-0:            #ffffff;\n\n  /* ---------- Functional / state ----------\n     Adopted from the Figma \"warnings/*\" tokens; tints derived. */\n  --state-success:        #27ae60;\n  --state-success-tint:   #e7f5ec;\n  --state-warning:        #ff8500;  /* Swizzle Orange */\n  --state-warning-tint:   #ffedd9;\n  --state-cautious:       #fff590;  /* soft yellow notice */\n  --state-cautious-tint:  #fffbe0;\n  --state-error:          #eb5757;\n  --state-error-tint:     #fdeaea;\n  --state-info:           #125891;  /* Deep Sea Blue  */\n  --state-info-tint:      #dce6ef;\n\n  /* ============================================================\n     SEMANTIC ALIASES — reference these in components.\n     ============================================================ */\n\n  /* Brand */\n  --brand-primary:        var(--deep-sea-blue);\n  --brand-accent:         var(--ocean-blue);\n  --brand-pink:           var(--bermuda-pink);\n  --brand-orange:         var(--swizzle-orange);\n\n  /* Text */\n  --text-primary:         var(--ink-900);\n  --text-secondary:       var(--ink-700);\n  --text-muted:           var(--ink-500);\n  --text-disabled:        var(--ink-300);\n  --text-brand:           var(--deep-sea-blue);\n  --text-pink:            var(--bermuda-pink);\n  --text-on-dark:         var(--white);\n  --text-link:            var(--deep-sea-blue);\n\n  /* Surfaces */\n  --surface-page:         var(--white);\n  --surface-tint:         var(--off-white);\n  --surface-card:         var(--white);\n  --surface-sky:          var(--sky-blue);\n  --surface-cream:        var(--cream);\n  --surface-deep:         var(--deep-sea-blue);   /* dark hero / footer */\n  --surface-ocean:        var(--ocean-blue);\n\n  /* Lines \u0026 borders */\n  --border-subtle:        var(--neutral-100);\n  --border-default:       var(--grey-200);\n  --border-strong:        var(--deep-sea-blue);\n  --border-focus:         var(--ocean-blue);\n\n  /* Interactive — structural blue */\n  --action-primary:       var(--deep-sea-blue);\n  --action-primary-hover: #0e466f;\n  --action-primary-press: #0a3556;\n  --action-accent:        var(--ocean-blue);\n  --action-accent-hover:  #0fbcc0;\n  --action-accent-press:  #0ba0a4;\n\n  /* Interactive — primary CTA (Bermuda Pink) */\n  --action-cta:           var(--bermuda-pink);\n  --action-cta-hover:     #e85ca3;\n  --action-cta-press:     #b81e69;\n\n  --focus-ring:           color-mix(in srgb, var(--ocean-blue) 55%, transparent);\n\n  /* ---------- Transactional surfaces \u0026 rails (booking flow) ----------\n     Additive palette for transactional screens (search, checkout, guest\n     details) — does not replace the marketing palette above. Panel tint\n     reuses --deep-sea-blue-15; --surface-panel-tint is the neutral variant\n     seen behind Guest Details / Extras / summary asides. Rail-* name the\n     colour-coded left-edge accents used on booking rows and cards. */\n  --surface-panel-tint:   #f4f4f4;\n  --rail-teal:            var(--ocean-blue);\n  --rail-blue:            var(--deep-sea-blue);\n  --rail-pink:            var(--bermuda-pink);\n  --rail-orange:          var(--swizzle-orange);\n}\n\u003c/style\u003e\n\u003cstyle\u003e/* ============================================================\n   BermudAir — Typography tokens  ·  v2 (2026 website evolution)\n   Reconciled with the Figma \"Typography\" Variable collection.\n   Evolution vs v1:\n     • HEADLINES now use Kepler Display (an elegant transitional\n       serif) — \"Used for all headlines\". Source Serif 4 remains\n       the self-hostable substitute for licensed Kepler.\n     • BODY / call-outs use Open Sauce One.\n     • Type scale aligned to the Figma heading + body ramp.\n   Casing: headlines are sentence case. The wordmark is the only\n   locked uppercase lockup; eyebrows may use small wide-tracked caps.\n   ============================================================ */\n:root {\n  /* ---------- Families ---------- */\n  --font-sans:    \"Open Sauce One\", \"Open Sauce Sans\", \"Arial\", system-ui, -apple-system, sans-serif;\n  --font-serif:   \"Source Serif 4\", \"Georgia\", \"Times New Roman\", serif;  /* Kepler substitute */\n  --font-display: var(--font-serif);   /* headlines are serif now */\n  --font-mono:    ui-monospace, \"SFMono-Regular\", \"Menlo\", monospace;\n\n  /* ---------- Weights ---------- */\n  --weight-light:    300;\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n  --weight-extrabold: 800;   /* Open Sauce One ExtraBold — times, fares, codes (transactional) */\n\n  /* ---------- Type scale (px @ 16px root) ----------\n     Mapped to the Figma ramp:\n       body  xsmall 10 · small 12 · medium 14 · base 16 · large 18 · xlarge 21\n       head  h6 24 · h5 27 · h4 32 · h3 40 · h2 48 · h1 64 */\n  --text-2xs:   0.625rem;   /* 10px — micro / legal            */\n  --text-xs:    0.75rem;    /* 12px — captions, eyebrows       */\n  --text-sm:    0.875rem;   /* 14px — secondary UI             */\n  --text-base:  1rem;       /* 16px — body default             */\n  --text-md:    1.125rem;   /* 18px — lead body                */\n  --text-lg:    1.3125rem;  /* 21px — xlarge body / small head */\n  --text-xl:    1.5rem;     /* 24px — H6                       */\n  --text-2xl:   1.6875rem;  /* 27px — H5                       */\n  --text-3xl:   2rem;       /* 32px — H4 / intro               */\n  --text-4xl:   2.5rem;     /* 40px — H3                       */\n  --text-5xl:   3rem;       /* 48px — H2                       */\n  --text-6xl:   4rem;       /* 64px — H1                       */\n\n  /* ---------- Semantic heading sizes (desktop · 1440) ---------- */\n  --heading-h1: var(--text-6xl);\n  --heading-h2: var(--text-5xl);\n  --heading-h3: var(--text-4xl);\n  --heading-h4: var(--text-3xl);\n  --heading-h5: var(--text-2xl);\n  --heading-h6: var(--text-xl);\n\n  /* ---------- Line heights ---------- */\n  --leading-none:    1;\n  --leading-tight:   1.1;    /* large serif display            */\n  --leading-snug:    1.25;\n  --leading-normal:  1.5;    /* body                           */\n  --leading-relaxed: 1.65;\n\n  /* ---------- Letter spacing ---------- */\n  --tracking-tight:   -0.01em;\n  --tracking-snug:    -0.005em;\n  --tracking-normal:  0em;\n  --tracking-wide:    0.04em;\n  --tracking-eyebrow: 0.14em;  /* uppercase eyebrows / labels   */\n\n  /* ============================================================\n     SEMANTIC TYPE ROLES\n     ============================================================ */\n  --type-display-font:     var(--font-serif);   /* Kepler Display */\n  --type-display-weight:   var(--weight-medium);\n  --type-display-tracking: var(--tracking-tight);\n  --type-display-leading:  var(--leading-tight);\n\n  --type-heading-font:     var(--font-serif);   /* all headlines = serif */\n  --type-heading-weight:   var(--weight-medium);\n  --type-heading-leading:  var(--leading-snug);\n\n  --type-editorial-font:    var(--font-serif);  /* large quotes / accents */\n  --type-editorial-weight:  var(--weight-regular);\n  --type-editorial-leading: var(--leading-snug);\n\n  --type-body-font:    var(--font-sans);        /* Open Sauce One */\n  --type-body-weight:  var(--weight-regular);\n  --type-body-leading: var(--leading-normal);\n\n  --type-eyebrow-font:     var(--font-sans);\n  --type-eyebrow-weight:   var(--weight-bold);\n  --type-eyebrow-size:     var(--text-xs);\n  --type-eyebrow-tracking: var(--tracking-eyebrow);\n}\n\u003c/style\u003e\n\u003cstyle\u003e/* ============================================================\n   BermudAir — Spacing, radii, shadows, motion\n   System: 4px base grid. Brand feel is airy, premium, boutique —\n   generous whitespace, soft shadows, calm easing.\n   ============================================================ */\n:root {\n  /* ---------- Spacing scale (4px base) ---------- */\n  --space-0:   0;\n  --space-1:   0.25rem;   /* 4  */\n  --space-2:   0.5rem;    /* 8  */\n  --space-3:   0.75rem;   /* 12 */\n  --space-4:   1rem;      /* 16 */\n  --space-5:   1.25rem;   /* 20 */\n  --space-6:   1.5rem;    /* 24 */\n  --space-8:   2rem;      /* 32 */\n  --space-10:  2.5rem;    /* 40 */\n  --space-12:  3rem;      /* 48 */\n  --space-16:  4rem;      /* 64 */\n  --space-20:  5rem;      /* 80 */\n  --space-24:  6rem;      /* 96 */\n  --space-32:  8rem;      /* 128 */\n\n  /* ---------- Radii ----------\n     Evolution: sharper, more editorial. Cards/inputs use small radii;\n     the pill is reserved for buttons, tags, chips and switches.\n     Reconciled with Figma UI Elements (sm 2 · md 4 · lg 12 · pill). */\n  --radius-xs:   2px;\n  --radius-sm:   2px;\n  --radius-md:   4px;\n  --radius-lg:   12px;\n  --radius-xl:   16px;\n  --radius-2xl:  24px;\n  --radius-3xl:  32px;   /* transactional section panels */\n  --radius-pill: 9999px;\n  --radius-circle: 50%;\n\n  /* ---------- Border widths ---------- */\n  --border-hairline: 1px;\n  --border-thin:     1.5px;\n  --border-thick:    2px;\n\n  /* ---------- Shadows ----------\n     Evolution: clean neutral-black shadows at low opacity (per the\n     Figma elevation set) — soft, never heavy. */\n  --shadow-xs:  0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-sm:  0 1px 3px rgba(0, 0, 0, 0.10);\n  --shadow-md:  0 4px 12px rgba(0, 0, 0, 0.10);\n  --shadow-lg:  0 8px 24px rgba(0, 0, 0, 0.12);\n  --shadow-xl:  0 16px 40px rgba(0, 0, 0, 0.16);\n  --shadow-focus: 0 0 0 3px var(--focus-ring);\n\n  /* ---------- Layout ---------- */\n  --container-sm:  640px;\n  --container-md:  840px;\n  --container-lg:  1100px;\n  --container-xl:  1320px;\n  --gutter:        var(--space-6);\n\n  /* ---------- Motion ----------\n     Calm and confident. Ease-out for entrances, gentle for hovers.\n     No bounce; the brand is composed, not playful-jittery. */\n  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --duration-fast:   140ms; /* @kind other */\n  --duration-base:   220ms; /* @kind other */\n  --duration-slow:   360ms; /* @kind other */\n  --transition-base: all var(--duration-base) var(--ease-out);\n}\n\u003c/style\u003e\n\u003cstyle\u003e/* ============================================================\n   BermudAir — Base element defaults\n   Light reset + brand defaults wired to tokens. Imported last.\n   ============================================================ */\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-weight: var(--weight-regular);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-primary);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  margin: 0;\n  font-family: var(--type-heading-font);\n  font-weight: var(--type-heading-weight);\n  line-height: var(--type-heading-leading);\n  color: var(--text-primary);\n  letter-spacing: var(--tracking-snug);\n}\n\np { margin: 0; }\n\na {\n  color: var(--text-link);\n  text-decoration: none;\n  transition: color var(--duration-fast) var(--ease-out);\n}\na:hover { color: var(--action-primary-hover); }\n\nimg, svg { display: block; max-width: 100%; }\n\nbutton, input, select, textarea { font: inherit; color: inherit; }\n\n::selection {\n  background: var(--ocean-blue-30);\n  color: var(--ink-900);\n}\n\n/* Utility: editorial serif accent (Kepler-style) */\n.ba-editorial {\n  font-family: var(--font-serif);\n  font-weight: var(--weight-regular);\n}\n\n/* Utility: eyebrow label */\n.ba-eyebrow {\n  font-family: var(--type-eyebrow-font);\n  font-weight: var(--type-eyebrow-weight);\n  font-size: var(--type-eyebrow-size);\n  letter-spacing: var(--type-eyebrow-tracking);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\u003c/style\u003e\n\u003cstyle\u003e/* required styles */\n\n.leaflet-pane,\n.leaflet-tile,\n.leaflet-marker-icon,\n.leaflet-marker-shadow,\n.leaflet-tile-container,\n.leaflet-pane \u003e svg,\n.leaflet-pane \u003e canvas,\n.leaflet-zoom-box,\n.leaflet-image-layer,\n.leaflet-layer {\n\tposition: absolute;\n\tleft: 0;\n\ttop: 0;\n\t}\n.leaflet-container {\n\toverflow: hidden;\n\t}\n.leaflet-tile,\n.leaflet-marker-icon,\n.leaflet-marker-shadow {\n\t-webkit-user-select: none;\n\t   -moz-user-select: none;\n\t        user-select: none;\n\t  -webkit-user-drag: none;\n\t}\n/* Prevents IE11 from highlighting tiles in blue */\n.leaflet-tile::selection {\n\tbackground: transparent;\n}\n/* Safari renders non-retina tile on retina better with this, but Chrome is worse */\n.leaflet-safari .leaflet-tile {\n\timage-rendering: -webkit-optimize-contrast;\n\t}\n/* hack that prevents hw layers \"stretching\" when loading new tiles */\n.leaflet-safari .leaflet-tile-container {\n\twidth: 1600px;\n\theight: 1600px;\n\t-webkit-transform-origin: 0 0;\n\t}\n.leaflet-marker-icon,\n.leaflet-marker-shadow {\n\tdisplay: block;\n\t}\n/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */\n/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */\n.leaflet-container .leaflet-overlay-pane svg {\n\tmax-width: none !important;\n\tmax-height: none !important;\n\t}\n.leaflet-container .leaflet-marker-pane img,\n.leaflet-container .leaflet-shadow-pane img,\n.leaflet-container .leaflet-tile-pane img,\n.leaflet-container img.leaflet-image-layer,\n.leaflet-container .leaflet-tile {\n\tmax-width: none !important;\n\tmax-height: none !important;\n\twidth: auto;\n\tpadding: 0;\n\t}\n\n.leaflet-container img.leaflet-tile {\n\t/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */\n\tmix-blend-mode: plus-lighter;\n}\n\n.leaflet-container.leaflet-touch-zoom {\n\t-ms-touch-action: pan-x pan-y;\n\ttouch-action: pan-x pan-y;\n\t}\n.leaflet-container.leaflet-touch-drag {\n\t-ms-touch-action: pinch-zoom;\n\t/* Fallback for FF which doesn\u0027t support pinch-zoom */\n\ttouch-action: none;\n\ttouch-action: pinch-zoom;\n}\n.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {\n\t-ms-touch-action: none;\n\ttouch-action: none;\n}\n.leaflet-container {\n\t-webkit-tap-highlight-color: transparent;\n}\n.leaflet-container a {\n\t-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4); -top:before {\n\tleft: 50%;\n\tmargin-left: -6px;\n\t}\n.leaflet-tooltip-top:before {\n\tbottom: 0;\n\tmargin-bottom: -12px;\n\tborder-top-color: #fff;\n\t}\n.leaflet-tooltip-bottom:before {\n\ttop: 0;\n\tmargin-top: -12px;\n\tmargin-left: -6px;\n\tborder-bottom-color: #fff;\n\t}\n.leaflet-tooltip-left {\n\tmargin-left: -6px;\n}\n.leaflet-tooltip-right {\n\tmargin-left: 6px;\n}\n.leaflet-tooltip-left:before,\n.leaflet-tooltip-right:before {\n\ttop: 50%;\n\tmargin-top: -6px;\n\t}\n.leaflet-tooltip-left:before {\n\tright: 0;\n\tmargin-right: -12px;\n\tborder-left-color: #fff;\n\t}\n.leaflet-tooltip-right:before {\n\tleft: 0;\n\tmargin-left: -12px;\n\tborder-right-color: #fff;\n\t}\n\n/* Printing */\n\n@media print {\n\t/* Prevent printers from removing background-images of controls. */\n\t.leaflet-control {\n\t\t-webkit-print-color-adjust: exact;\n\t\tprint-color-adjust: exact;\n\t\t}\n\t}\n\u003c/style\u003e\n\u003cscript src=\"ee84c09e-d8a1-4cb2-a919-fd62430cc6ed\" integrity=\"sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH\" crossorigin=\"anonymous\"\u003e\u003c/script\u003e\n\u003cscript src=\"5c0f0af2-1c8d-4245-bd34-ac4fad0120d4\"\u003e\u003c/script\u003e\n\u003cscript src=\"8cc02a89-1a6c-4764-9d63-eacf7761388b\"\u003e\u003c/script\u003e\n\u003cstyle\u003e\n  * { box-sizing: border-box; }\n  html, body { height: 100%; margin: 0; overflow: hidden; }\n  body { font-family: var(--font-sans); color: var(--white); background: var(--deep-sea-blue); }\n  a { color: var(--ocean-blue); }\n  a:hover { color: var(--ocean-blue-70); }\n  button { font-family: inherit; }\n  svg { display: block; }\n\n  .app { display: flex; height: 100vh; width: 100vw; }\n\n  /* ---------- Panel ---------- */\n  .panel {\n    flex: 0 0 448px;\n    width: 448px;\n    background: var(--deep-sea-blue);\n    position: relative;\n    z-index: 20;\n    box-shadow: var(--shadow-lg);\n    display: flex;\n    flex-direction: column;\n  }\n  .brand { padding: 28px 32px 0; flex-shrink: 0; }\n  .brand img { width: 148px; height: auto; display: block; }\n\n  .panel-scroll { flex: 1; overflow-y: auto; padding: 24px 32px 40px; }\n  .panel-scroll::-webkit-scrollbar { width: 8px; }\n  .panel-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }\n\n  .eyebrow { display: block; font-family: var(--font-sans); font-size: 12px; font-weight: var(--weight-bold); text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 10px; }\n  .eyebrow-featured { color: var(--ocean-blue-50); }\n  .eyebrow-legend { color: var(--ocean-blue); margin-bottom: 12px; }\n\n  h1.pane-title { font-family: var(--font-serif); font-weight: var(--weight-regular); font-size: var(--text-5xl); line-height: var(--leading-tight); letter-spacing: var(--tracking-tight); color: var(--off-white); margin: 6px 0 16px; }\n  .intro-copy { color: rgba(249,249,245,.82); line-height: var(--leading-relaxed); font-size: var(--text-md); margin: 0 0 32px; }\n\n  .dest-list { display: flex; flex-direction: column; gap: 6px; list-style: none; padding: 0; margin: 0 0 24px; }\n  .dest-tile {\n    display: flex; align-items: center; gap: 14px; width: 100%;\n    background: rgba(255,255,255,.05); border: none;\n    border-radius: 10px; padding: 9px 16px;\n    cursor: pointer; text-align: left; color: var(--white);\n    transition: background var(--duration-fast) var(--ease-out);\n  }\n  .dest-tile:hover, .dest-tile:focus-visible { background: rgba(255,255,255,.12); }\n  .dest-tile:focus-visible { outline: 2px solid var(--ocean-blue); outline-offset: 2px; }\n  .dest-tile .ti-info { flex: 1; min-width: 0; }\n  .dest-tile .ti-city { display: block; font-size: var(--text-md); color: #f4f4f4; font-weight: var(--weight-regular); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .dest-tile .ti-region { display: block; font-size: 11px; font-weight: var(--weight-bold); letter-spacing: .05em; text-transform: uppercase; color: rgba(255,255,255,.65); margin-top: 3px; }\n  .code-pill { flex-shrink: 0; background: rgba(249,249,245,.9); color: var(--deep-sea-blue); font-family: var(--font-sans); font-weight: var(--weight-bold); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: var(--radius-pill); min-width: 46px; text-align: center; }\n  .code-pill.hub-pill { background: var(--bermuda-pink); color: #fff; }\n\n  .toggle-all { background: none; border: none; color: rgba(255,255,255,.75); font-size: var(--text-sm); font-weight: var(--weight-semibold); padding: 4px 0; cursor: pointer; display: flex; align-items: center; gap: 6px; }\n  .toggle-all:hover { color: var(--white); }\n  .toggle-all .ic svg { transition: transform var(--duration-fast) var(--ease-out); }\n  .toggle-all[aria-expanded=\"true\"] .ic svg { transform: rotate(180deg); }\n  #allDestWrap[hidden] { display: none; }\n  #allDestWrap { margin-top: 10px; }\n\n  .legend { display: flex; flex-direction: column; gap: 7px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.14); margin-top: auto; }\n  .legend-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,.72); }\n  .legend-swatch { width: 22px; height: 0; border-top: 2.5px solid rgba(255,255,255,.7); flex-shrink: 0; }\n  .legend-swatch.dashed { border-top-style: dashed; }\n\n  /* ---------- Detail panel ---------- */\n  #panelDetail[hidden] { display: none; }\n  .back-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; color: rgba(255,255,255,.75); font-size: var(--text-sm); font-weight: var(--weight-semibold); padding: 0 0 20px; cursor: pointer; }\n  .back-btn:hover { color: var(--white); }\n\n  .detail-image { height: 220px; border-radius: 8px; overflow: hidden; margin-bottom: 24px; background: rgba(255,255,255,.06); }\n  .detail-image img { width: 100%; height: 100%; object-fit: cover; display: block; }\n\n  .detail-head { margin-bottom: 16px; }\n  .detail-head .code-pill { margin-bottom: 12px; display: inline-block; }\n  .detail-head .code-pill + .code-pill { margin-left: 6px; }\n  .detail-head h2 { font-family: var(--font-serif); font-weight: var(--weight-regular); font-size: var(--text-4xl); color: var(--off-white); margin: 0 0 6px; line-height: 1.05; }\n  .detail-head .region { display: block; font-size: 12px; font-weight: var(--weight-bold); letter-spacing: .06em; text-transform: uppercase; color: var(--ocean-blue-50); }\n\n  .detail-desc { color: rgba(249,249,245,.85); line-height: var(--leading-relaxed); font-size: var(--text-base); margin: 0 0 20px; }\n\n\n  .cta-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }\n  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 20px; font-family: var(--font-sans); font-weight: var(--weight-semibold); font-size: var(--text-sm); letter-spacing: .01em; border-radius: var(--radius-pill); cursor: pointer; border: none; white-space: nowrap; transition: background var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out); }\n  .btn:active { transform: scale(.97); }\n  .btn-primary { background: var(--bermuda-pink); color: #fff; }\n  .btn-primary:hover { background: var(--action-cta-hover); box-shadow: var(--shadow-md); }\n  .btn-tertiary { background: var(--off-white); color: var(--deep-sea-blue); }\n  .btn-tertiary:hover { background: #fff; box-shadow: var(--shadow-md); }\n  .link-schedule { background: none; border: none; color: var(--ocean-blue-50); font-family: var(--font-sans); font-weight: var(--weight-semibold); font-size: var(--text-sm); cursor: pointer; display: flex; align-items: center; gap: 7px; padding: 4px 0; }\n  .link-schedule:hover { color: var(--ocean-blue); }\n  .link-schedule .ic svg { transform: rotate(-90deg); transition: transform var(--duration-fast) var(--ease-out); }\n  .link-schedule[aria-expanded=\"true\"] .ic svg { transform: rotate(0deg); }\n\n  #scheduleWrap[hidden] { display: none; }\n  #scheduleWrap { border-top: 1px solid rgba(255,255,255,.14); padding-top: 16px; margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }\n  .sched-row { display: flex; justify-content: space-between; gap: 16px; font-size: var(--text-sm); }\n  .sched-route { display: flex; align-items: center; gap: 8px; color: var(--white); font-weight: var(--weight-medium); flex-shrink: 0; }\n  .sched-route .code-pill { padding: 3px 8px; font-size: 10px; min-width: 38px; }\n  .sched-meta { color: rgba(255,255,255,.65); text-align: right; }\n  .sched-meta.seasonal { color: var(--ocean-blue-50); }\n  .sched-cta { display: flex; align-items: center; gap: 6px; color: var(--ocean-blue-50); font-weight: var(--weight-semibold); font-size: var(--text-sm); text-decoration: none; }\n  .sched-cta:hover { color: var(--ocean-blue); text-decoration: underline; }\n\n  /* ---------- Map ---------- */\n  .map-wrap { flex: 1; position: relative; min-width: 0; }\n  #map { position: absolute; inset: 0; background: var(--deep-sea-blue); }\n  .leaflet-tile-pane { filter: saturate(.55) brightness(1.08) hue-rotate(-6deg); }\n  .leaflet-container { font-family: var(--font-sans); }\n  .leaflet-control-attribution { background: rgba(249,249,245,.92) !important; color: var(--grey-600) !important; }\n  a.leaflet-control-attribution { color: var(--grey-700) !important; }\n\n  .leaflet-control-zoom { border-radius: var(--radius-md) !important; overflow: hidden; box-shadow: var(--shadow-md) !important; border: none !important; }\n  .leaflet-control-zoom a { background: var(--deep-sea-blue) !important; color: #fff !important; border: none !important; width: 34px !important; height: 34px !important; line-height: 34px !important; }\n  .leaflet-control-zoom a:hover { background: var(--bermuda-pink-70) !important; }\n  .reset-btn { background: var(--deep-sea-blue); color: #fff; width: 34px; height: 34px; border-radius: var(--radius-md); border: none; box-shadow: var(--shadow-md); cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 8px; }\n  .reset-btn:hover { background: var(--bermuda-pink-70); }\n\n  /* Markers */\n  .pin-icon { background: none; border: none; }\n  .pin { position: relative; background: none; border: none; padding: 0; cursor: pointer; display: block; }\n  .pin .dot { display: block; width: 11px; height: 11px; border-radius: 50%; background: var(--deep-sea-blue); box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.35); transition: background var(--duration-fast) var(--ease-out); }\n  .pin.orange .dot { background: var(--swizzle-orange); }\n  .pin.pink .dot { background: var(--bermuda-pink); width: 14px; height: 14px; margin: -1.5px; }\n  .pin .badge {\n    position: absolute; left: 15px; top: -12px; white-space: nowrap; text-align: center; min-width: 46px;\n    font-family: var(--font-sans); font-weight: var(--weight-bold); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;\n    color: #fff; background: var(--deep-sea-blue); opacity: .94; padding: 6px 10px; border-radius: var(--radius-pill);\n    box-shadow: 1px 2px 3px rgba(0,0,0,.25); transition: background var(--duration-fast) var(--ease-out), opacity var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);\n  }\n  .pin.orange .badge { background: #d07008; }\n  .pin.pink .badge { background: var(--bermuda-pink-70); font-size: 12px; min-width: 50px; }\n  .pin:hover .badge, .pin.active .badge, .pin.neighbor .badge { background: var(--bermuda-pink-70); opacity: 1; }\n  .pin.active .badge { transform: scale(1.08); }\n  .pin.dim { opacity: .35; }\n  body.zoom-compact .pin.compact .badge { display: none; }\n  body.zoom-compact .pin.compact:hover .badge,\n  body.zoom-compact .pin.compact:focus-visible .badge,\n  body.zoom-compact .pin.compact.active .badge { display: inline-block; }\n  .pin:focus-visible .dot { box-shadow: 0 0 0 3px var(--ocean-blue); }\n\n  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n  /* ---------- Mobile ---------- */\n  @media (max-width: 860px) {\n    .app { flex-direction: column; }\n    .panel { width: auto; flex: 0 0 auto; max-height: 148px; overflow: hidden; order: 2; transition: max-height var(--duration-slow) var(--ease-out); box-shadow: 0 -8px 24px rgba(0,0,0,.3); }\n    .panel.expanded { max-height: 78vh; }\n    .map-wrap { order: 1; flex: 1; }\n    .sheet-handle { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; background: none; border: none; color: rgba(255,255,255,.75); font-size: var(--text-sm); font-weight: var(--weight-bold); padding: 14px 0 4px; cursor: pointer; flex-shrink: 0; }\n    .sheet-handle::before { content: \"\"; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); }\n    .sheet-handle .ic svg { transition: transform var(--duration-fast) var(--ease-out); }\n    .panel.expanded .sheet-handle .ic svg { transform: rotate(180deg); }\n    .panel:not(.expanded) .panel-scroll { overflow: hidden; }\n    .brand { padding-top: 4px; }\n  }\n  @media (min-width: 861px) {\n    .sheet-handle { display: none; }\n  }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"app\" id=\"root\"\u003e\n  \u003caside class=\"panel\" id=\"panelEl\" aria-label=\"Where We Fly\"\u003e\n    \u003cbutton class=\"sheet-handle\" id=\"sheetHandle\" type=\"button\" aria-expanded=\"false\"\u003e\n      \u003cspan class=\"handle-label\"\u003eSlide Up For Details\u003c/span\u003e\n      \u003cspan class=\"ic\" id=\"icSheet\"\u003e\u003c/span\u003e\n    \u003c/button\u003e\n    \u003cdiv class=\"brand\"\u003e\n      \u003cimg src=\"3be46dd7-3788-4e32-9bae-81a4b7d123f1\" alt=\"BermudAir\"\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"panel-scroll\"\u003e\n      \u003cdiv id=\"panelDefault\"\u003e\n        \u003ch1 class=\"pane-title\"\u003eWhere We Fly\u003c/h1\u003e\n        \u003cp class=\"intro-copy\"\u003eFlying between Bermuda, Canada, and the U.S. — with seasonal service to Central America and the Caribbean — BermudAir is your connection to comfort, care, and an experience that feels like home, every time.\u003c/p\u003e\n\n        \u003cp class=\"eyebrow eyebrow-featured\"\u003eFeatured Destinations\u003c/p\u003e\n        \u003cul class=\"dest-list\" id=\"featuredList\"\u003e\u003c/ul\u003e\n\n        \u003cbutton class=\"toggle-all\" id=\"toggleAllBtn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"allDestWrap\"\u003e\n          \u003cspan class=\"ic\" id=\"icToggleAll\"\u003e\u003c/span\u003e\n          View all destinations\n        \u003c/button\u003e\n        \u003cdiv id=\"allDestWrap\" hidden=\"\"\u003e\n          \u003cul class=\"dest-list\" id=\"allDestList\"\u003e\u003c/ul\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"legend\"\u003e\n          \u003cp class=\"eyebrow eyebrow-legend\"\u003eMap Legend\u003c/p\u003e\n          \u003cdiv class=\"legend-row\"\u003e\u003cspan class=\"legend-swatch\"\u003e\u003c/span\u003e Nonstop service\u003c/div\u003e\n          \u003cdiv class=\"legend-row\"\u003e\u003cspan class=\"legend-swatch dashed\"\u003e\u003c/span\u003e Direct\u003c/div\u003e\n          \u003cdiv class=\"legend-row\"\u003e\u003cspan class=\"legend-swatch\" style=\"border-top-color:var(--bermuda-pink)\"\u003e\u003c/span\u003e To/from Bermuda\u003c/div\u003e\n          \u003cdiv class=\"legend-row\"\u003e\u003cspan class=\"legend-swatch\" style=\"border-top-color:var(--swizzle-orange)\"\u003e\u003c/span\u003e Other island destinations\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv id=\"panelDetail\" hidden=\"\"\u003e\n        \u003cbutton class=\"back-btn\" id=\"backBtn\" type=\"button\"\u003e\n          \u003cspan class=\"ic\" id=\"icBack\"\u003e\u003c/span\u003e Back to all destinations\n        \u003c/button\u003e\n        \u003cdiv class=\"detail-image\" id=\"detailImageWrap\"\u003e\u003c/div\u003e\n        \u003cdiv class=\"detail-head\"\u003e\n          \u003cspan class=\"code-pill\" id=\"detailPill\"\u003e\u003c/span\u003e\n          \u003cspan class=\"code-pill\" id=\"detailPill2\" style=\"display:none\"\u003e\u003c/span\u003e\n          \u003ch2 id=\"detailName\"\u003e\u003c/h2\u003e\n          \u003cspan class=\"region\" id=\"detailRegion\"\u003e\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cp class=\"detail-desc\" id=\"detailDesc\"\u003e\u003c/p\u003e\n        \u003cdiv class=\"cta-row\"\u003e\n          \u003cbutton class=\"btn btn-tertiary\" id=\"exploreBtn\" type=\"button\"\u003e\u003c/button\u003e\n          \u003cbutton class=\"btn btn-primary\" id=\"bookBtn\" type=\"button\"\u003eBook Now\u003c/button\u003e\n        \u003c/div\u003e\n        \u003cbutton class=\"link-schedule\" id=\"scheduleToggle\" type=\"button\" aria-expanded=\"true\" aria-controls=\"scheduleWrap\"\u003e\n          \u003cspan class=\"ic\" id=\"icSched\"\u003e\u003c/span\u003e Routes\n        \u003c/button\u003e\n        \u003cdiv id=\"scheduleWrap\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/aside\u003e\n\n  \u003cdiv class=\"map-wrap\"\u003e\n    \u003cdiv id=\"map\" role=\"application\" aria-label=\"BermudAir route map\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"sr-only\" role=\"status\" aria-live=\"polite\" id=\"liveRegion\"\u003e\u003c/div\u003e\n\n\u003cscript\u003e\n/* ===================== Icon helper (real BermudAir icon set) ===================== */\nfunction icon(name, size, color){\n  const d = window.BA_ICONS \u0026\u0026 window.BA_ICONS[name];\n  size = size || 16;\n  if (!d) return \u0027\u0027;\n  return `\u003csvg width=\"${size}\" height=\"${size}\" viewBox=\"${d.viewBox}\" fill=\"none\" style=\"${color ? \u0027color:\u0027+color+\u0027;\u0027 : \u0027\u0027}\"\u003e${d.body}\u003c/svg\u003e`;\n}\n\n/* ===================== Data ===================== */\nconst COLOR = { pink: \u0027#dc287f\u0027, pinkSoft: \u0027#ee3890\u0027, orange: \u0027#ff8500\u0027 };\nconst BOOK_URL = \u0027https://flybermudair.com/book\u0027;\n\n// type: hub = BDA · focus = island mini-hubs (orange, always labeled) ·\n// leisure = seasonal island/Florida spokes (orange, dot-only) · gateway = core US/Canada network (blue, dot-only)\nconst TONE = { hub: \u0027pink\u0027, focus: \u0027orange\u0027, leisure: \u0027orange\u0027, gateway: \u0027blue\u0027 };\nconst PROMINENT = { hub: true, focus: true, leisure: false, gateway: false };\n\nconst NODES = {\n  BDA: { code:\u0027BDA\u0027, name:\u0027Hamilton\u0027, region:\u0027Bermuda\u0027, type:\u0027hub\u0027, lat:32.3640, lng:-64.6787,\n    blurb:\u0027Pink-sand beaches, turquoise waters, and championship golf just a short flight away. A polished island escape blending British charm with Atlantic island beauty.\u0027,\n    photo:\u0027https://a.storyblok.com/f/291813464367698/8514x5676/569eb41c65/bda-hero.jpg\u0027,\n    exploreUrl:\u0027https://flybermudair.com/pages/explore/destinatons/bermuda\u0027 },\n  AXA: { code:\u0027AXA\u0027, name:\u0027Anguilla\u0027, region:\u0027Anguilla\u0027, type:\u0027focus\u0027, lat:18.2050, lng:-63.0548,\n    blurb:\u0027Caribbean serenity defined. Powder-white sands, secluded luxury villas, and a celebrated culinary scene that celebrates a vibrant Caribbean culture.\u0027,\n    photo:\u0027https://a.storyblok.com/f/291813464367698/5464x3640/4eb107c325/axa-hero.jpg\u0027,\n    exploreUrl:\u0027https://flybermudair.com/pages/explore/destinatons/anguilla\u0027 },\n  BZE: { code:\u0027BZE\u0027, name:\u0027Belize City\u0027, region:\u0027Belize\u0027, type:\u0027focus\u0027, lat:17.5391, lng:-88.3082,\n    blurb:\"Jungle, reefs, and ruins all in one destination. In Belize, paddle through Maya cave systems, snorkel the world\u0027s second-largest barrier reef, and end the day with Garifuna drumming on the beach.\",\n    photo:\u0027https://a.storyblok.com/f/291813464367698/3600x2250/50152dca81/bze-hero.jpg\u0027,\n    exploreUrl:\u0027https://flybermudair.com/pages/explore/destinatons/belize\u0027 },\n  PLS: { code:\u0027PLS\u0027, name:\u0027Providenciales\u0027, region:\u0027Turks \u0026 Caicos\u0027, type:\u0027focus\u0027, lat:21.7736, lng:-72.2658,\n    photo:\u0027https://a.storyblok.com/f/291813464367698/6720x4480/6925e477e9/pls-hero.jpg\u0027,\n    group:\u0027PLSXSC\u0027 },\n  XSC: { code:\u0027XSC\u0027, name:\u0027South Caicos\u0027, region:\u0027Turks \u0026 Caicos\u0027, type:\u0027focus\u0027, lat:21.5194, lng:-71.5311,\n    photo:\u0027https://a.storyblok.com/f/291813464367698/7360x4912/96ded3901a/pls-flight-card-2.jpg\u0027,\n    group:\u0027PLSXSC\u0027 },\n  GUA: { code:\u0027GUA\u0027, name:\u0027Guatemala City\u0027, region:\u0027Guatemala\u0027, type:\u0027focus\u0027, lat:14.5833, lng:-90.5275,\n    blurb:\u0027Discover a dynamic city of museums, markets, and rooftop restaurants set against a backdrop of volcanoes.\u0027,\n    photo:\u0027https://a.storyblok.com/f/291813464367698/6016x4016/1d1e9f8daa/gua-hero.jpg\u0027,\n    exploreUrl:\u0027https://flybermudair.com/pages/explore/destinatons/guatemala-city\u0027 },\n  BWI: { code:\u0027BWI\u0027, name:\u0027Baltimore/Washington\u0027, region:\u0027Maryland, USA\u0027, type:\u0027gateway\u0027, lat:39.1754, lng:-76.6684,\n    blurb:\u0027Iconic American history, a buzzing Inner Harbor, and easy access to the U.S. capital. Indulge in fresh seafood, explore national monuments, and more.\u0027,\n    photo:\u0027https://a.storyblok.com/f/291813464367698/5000x3333/98af6d58b6/bwi-hero.jpg\u0027,\n    exploreUrl:\u0027https://flybermudair.com/pages/explore/destinatons/baltimore-washington\u0027 },\n  BOS: { code:\u0027BOS\u0027, name:\u0027Boston\u0027, region:\u0027Massachusetts, USA\u0027, type:\u0027gateway\u0027, lat:42.3656, lng:-71.0096,\n    blurb:\u0027Walk the Freedom Trail, explore Faneuil Hall, and dig into legendary clam chowder and lobster rolls in a city where colonial history meets modern energy.\u0027,\n    photo:\u0027https://a.storyblok.com/f/291813464367698/612x405/bbaeec0295/bos-hero.jpg\u0027,\n    exploreUrl:\u0027https://flybermudair.com/pages/explore/destinatons/boston\u0027 },\n  YHZ: { code:\u0027YHZ\u0027, name:\u0027Halifax\u0027, region:\u0027Nova Scotia, CAN\u0027, type:\u0027gateway\u0027, lat:44.8808, lng:-63.5086,\n    blurb:\"Fresh harbor breezes, rich naval history, fresh seafood, stunning coastal beauty, and a lively arts scene make Halifax Atlantic Canada\u0027s Maritime gem.\",\n    photo:\u0027https://a.storyblok.com/f/291813464367698/612x459/bb108a43ab/yhz-hero.jpg\u0027,\n    exploreUrl:\u0027https://flybermudair.com/pages/explore/destinatons/halifax\u0027 },\n  YUL: { code:\u0027YUL\u0027, name:\u0027Montréal\u0027, region:\u0027Quebec, CAN\u0027, type:\u0027gateway\u0027, lat:45.4706, lng:-73.7408,\n    blurb:\u0027Old World cobblestones, French-Canadian flair, and a dazzling food scene from poutine to fine dining. Find festivals, museums, and street art on every corner.\u0027,\n    photo:\u0027https://a.storyblok.com/f/291813464367698/1920x1280/13785f8a3a/yul-hero.jpg\u0027,\n    exploreUrl:\u0027https://flybermudair.com/pages/explore/destinatons/montreal\u0027 },\n  HPN: { code:\u0027HPN\u0027, name:\u0027Westchester\u0027, region:\u0027New York, USA\u0027, type:\u0027gateway\u0027, lat:41.0670, lng:-73.7076,\n    blurb:\u0027A small airport with easy access to the big city energy of New York. Take in a Broadway show, walk the Brooklyn Bridge, and visit the Statue of Liberty.\u0027,\n    exploreUrl:\u0027https://flybermudair.com/pages/explore/destinatons/westchester\u0027 },\n  MCO: { code:\u0027MCO\u0027, name:\u0027Orlando\u0027, region:\u0027Florida, USA\u0027, type:\u0027leisure\u0027, lat:28.4312, lng:-81.3081 03e\u003cpath d=\"M20 15v5h-5\"/\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/\u003e\u003c/svg\u003e\u0027;\n    L.DomEvent.on(btn, \u0027click\u0027, (e) =\u003e { L.DomEvent.stop(e); fitAll(); });\n    return btn;\n  }\n});\nmap.addControl(new ResetControl());\n\nconst allLatLngs = Object.values(NODES).map(n =\u003e [n.lat, n.lng]);\nfunction fitAll(){\n  const mobile = window.matchMedia(\u0027(max-width:860px)\u0027).matches;\n  map.fitBounds(allLatLngs, mobile ? { padding:[30,30] } : { paddingTopLeft:[60,50], paddingBottomRight:[60,50] });\n}\nfitAll();\nwindow.addEventListener(\u0027resize\u0027, () =\u003e { map.invalidateSize(); });\n\nfunction updateZoomClass(){ document.body.classList.toggle(\u0027zoom-compact\u0027, map.getZoom() \u003c 6); }\nmap.on(\u0027zoomend\u0027, updateZoomClass);\nupdateZoomClass();\n\n/* Arc helper: quadratic-bezier curve between two lat/lngs, sampled as a polyline */\nfunction arcLatLngs(p1, p2, bend, steps){\n  bend = bend || 0.16; steps = steps || 36;\n  const y1=p1[0], x1=p1[1], y2=p2[0], x2=p2[1];\n  const mx=(x1+x2)/2, my=(y1+y2)/2;\n  const dx=x2-x1, dy=y2-y1;\n  const dist = Math.hypot(dx,dy);\n  let nx=-dy, ny=dx; const nlen = Math.hypot(nx,ny) || 1;\n  nx/=nlen; ny/=nlen;\n  const cx = mx + nx*dist*bend, cy = my + ny*dist*bend;\n  const pts = [];\n  for (let i=0;i\u003c=steps;i++){\n    const t=i/steps, u=1-t;\n    pts.push([u*u*y1 + 2*u*t*cy + t*t*y2, u*u*x1 + 2*u*t*cx + t*t*x2]);\n  }\n  return pts;\n}\n\nlet arcLayers = [];\nfunction clearArcs(){ arcLayers.forEach(l =\u003e map.removeLayer(l)); arcLayers = []; }\nfunction drawArcsFor(code, locked){\n  clearArcs();\n  (ADJ[code]||[]).forEach(n =\u003e {\n    const touchesHub = code === \u0027BDA\u0027 || n === \u0027BDA\u0027;\n    const line = L.polyline(arcLatLngs([NODES[code].lat,NODES[code].lng], [NODES[n].lat,NODES[n].lng]), {\n      color: touchesHub ? COLOR.pink : COLOR.orange,\n      weight: locked ? 3 : 2,\n      opacity: locked ? 0.85 : 0.45,\n      dashArray: isConnecting(code, n) ? \u00272 8\u0027 : null,\n      interactive: false\n    });\n    line.addTo(map);\n    arcLayers.push(line);\n  });\n}\n\n/* Markers */\nconst markerEls = {};\nObject.values(NODES).forEach(n =\u003e {\n  const cls = `pin ${TONE[n.type]} ${PROMINENT[n.type] ? \u0027prominent\u0027 : \u0027compact\u0027}`;\n  const divIcon = L.divIcon({\n    className: \u0027pin-icon\u0027,\n    html: `\u003cbutton type=\"button\" class=\"${cls}\" data-code=\"${n.code}\" aria-label=\"${n.name}, ${n.code} — view routes\"\u003e\u003cspan class=\"dot\"\u003e\u003c/span\u003e\u003cspan class=\"badge\"\u003e${n.code}\u003c/span\u003e\u003c/button\u003e`,\n    iconSize: [0,0], iconAnchor: [0,0]\n  });\n  const marker = L.marker([n.lat, n.lng], { icon: divIcon }).addTo(map);\n  const el = marker.getElement();\n  const btn = el.querySelector(\u0027button\u0027);\n  markerEls[n.code] = btn;\n  btn.addEventListener(\u0027click\u0027, () =\u003e selectNode(n.code));\n  btn.addEventListener(\u0027mouseenter\u0027, () =\u003e previewNode(n.code));\n  btn.addEventListener(\u0027mouseleave\u0027, clearPreview);\n  btn.addEventListener(\u0027focus\u0027, () =\u003e previewNode(n.code));\n  btn.addEventListener(\u0027blur\u0027, clearPreview);\n});\n\n/* Providenciales (PLS) and South Caicos (XSC) share one small island group: zoomed out they\n   collapse into a single \"PLS/XSC\" pill over Turks \u0026 Caicos; zoomed in they split back into\n   their own dots at their exact locations. Routes/schedules stay per-airport either way. */\nconst MERGE_ZOOM = 6;\nconst plsXscMid = [(NODES.PLS.lat + NODES.XSC.lat) / 2, (NODES.PLS.lng + NODES.XSC.lng) / 2];\nconst mergedIcon = L.divIcon({\n  className: \u0027pin-icon\u0027,\n  html: `\u003cbutton type=\"button\" class=\"pin orange prominent\" data-code=\"PLS\" aria-label=\"Providenciales and South Caicos, PLS/XSC — view routes\"\u003e\u003cspan class=\"dot\"\u003e\u003c/span\u003e\u003cspan class=\"badge\"\u003ePLS/XSC\u003c/span\u003e\u003c/button\u003e`,\n  iconSize: [0,0], iconAnchor: [0,0]\n});\nconst mergedMarker = L.marker(plsXscMid, { icon: mergedIcon }).addTo(map);\nconst mergedBtn = mergedMarker.getElement().querySelector(\u0027button\u0027);\nmergedBtn.addEventListener(\u0027click\u0027, () =\u003e selectNode(\u0027PLS\u0027));\nmergedBtn.addEventListener(\u0027mouseenter\u0027, () =\u003e previewNode(\u0027PLS\u0027));\nmergedBtn.addEventListener(\u0027mouseleave\u0027, clearPreview);\nmergedBtn.addEventListener(\u0027focus\u0027, () =\u003e previewNode(\u0027PLS\u0027));\nmergedBtn.addEventListener(\u0027blur\u0027, clearPreview);\n\nfunction updatePLSXSCMerge(){\n  const split = map.getZoom() \u003e= MERGE_ZOOM;\n  markerEls.PLS.parentElement.style.display = split ? \u0027\u0027 : \u0027none\u0027;\n  markerEls.XSC.parentElement.style.display = split ? \u0027\u0027 : \u0027none\u0027;\n  mergedBtn.parentElement.style.display = split ? \u0027none\u0027 : \u0027\u0027;\n}\nmap.on(\u0027zoomend\u0027, updatePLSXSCMerge);\nupdatePLSXSCMerge();\n\n/* ===================== Selection state ===================== */\nlet currentCode = null;\nconst panelDefault = document.getElementById(\u0027panelDefault\u0027);\nconst panelDetail = document.getElementById(\u0027panelDetail\u0027);\nconst liveRegion = document.getElementById(\u0027liveRegion\u0027);\nconst panelEl = document.getElementById(\u0027panelEl\u0027);\n\nfunction updateMarkerVisuals(){\n  const neighbors = currentCode ? new Set(ADJ[currentCode] || []) : null;\n  Object.entries(markerEls).forEach(([code, btn]) =\u003e {\n    btn.classList.toggle(\u0027active\u0027, code === currentCode);\n    btn.classList.toggle(\u0027neighbor\u0027, !!neighbors \u0026\u0026 neighbors.has(code));\n    btn.classList.toggle(\u0027dim\u0027, !!currentCode \u0026\u0026 code !== currentCode \u0026\u0026 !(neighbors \u0026\u0026 neighbors.has(code)));\n  });\n  const plsXscSelected = currentCode === \u0027PLS\u0027 || currentCode === \u0027XSC\u0027;\n  mergedBtn.classList.toggle(\u0027active\u0027, plsXscSelected);\n  mergedBtn.classList.toggle(\u0027dim\u0027, !!currentCode \u0026\u0026 !plsXscSelected);\n}\n\nfunction previewNode(code){\n  if (currentCode) return;\n  drawArcsFor(code, false);\n}\nfunction clearPreview(){\n  if (currentCode) return;\n  clearArcs();\n}\n\nfunction scheduleRowHTML(fromCode, toCode){\n  const info = SCHED[fromCode + \u0027 → \u0027 + toCode] || SCHED[toCode + \u0027 → \u0027 + fromCode];\n  const to = NODES[toCode];\n  if (!info) return \u0027\u0027;\n  const meta = info.c ? \u0027Year-round\u0027 : \u0027Seasonal\u0027;\n  return `\u003cdiv class=\"sched-row\"\u003e\n    \u003cspan class=\"sched-route\"\u003e\u003cspan class=\"code-pill\"\u003e${toCode}\u003c/span\u003e${to.name}\u003c/span\u003e\n    \u003cspan class=\"sched-meta${info.c ? \u0027\u0027 : \u0027 seasonal\u0027}\"\u003e${meta}\u003c/span\u003e\n  \u003c/div\u003e`;\n}\n\nfunction renderDetail(code){\n  const n = NODES[code];\n  const g = n.group ? GROUPS[n.group] : null;\n  const display = g || n;\n\n  document.getElementById(\u0027detailPill\u0027).textContent = n.code;\n  document.getElementById(\u0027detailPill\u0027).className = n.type === \u0027hub\u0027 ? \u0027code-pill hub-pill\u0027 : \u0027code-pill\u0027;\n  const pill2 = document.getElementById(\u0027detailPill2\u0027);\n  const secondCode = g ? g.pills.find(c =\u003e c !== n.code) : n.extraPill;\n  pill2.textContent = secondCode || \u0027\u0027;\n  pill2.style.display = secondCode ? \u0027inline-block\u0027 : \u0027none\u0027;\n  document.getElementById(\u0027detailName\u0027).textContent = display.name;\n  document.getElementById(\u0027detailRegion\u0027).textContent = display.region;\n  document.getElementById(\u0027detailDesc\u0027).textContent = display.blurb;\n  document.getElementById(\u0027exploreBtn\u0027).textContent = \u0027Explore \u0027 + display.name;\n  document.getElementById(\u0027exploreBtn\u0027).onclick = () =\u003e { window.location.href = display.exploreUrl; };\n\n  document.querySelectorAll(\u0027#detailImageWrap img\u0027).forEach(el =\u003e { el.style.display = el.dataset.code === code ? \u0027block\u0027 : \u0027none\u0027; });\n\n  const rows = (ADJ[code]||[]).slice().sort((a,b)=\u003eNODES[a].name.localeCompare(NODES[b].name)).map(nb =\u003e scheduleRowHTML(code, nb)).join(\u0027\u0027);\n  const arrowRight = \u0027\u003csvg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u003e\u003cpath d=\"M9 6l6 6-6 6\"/\u003e\u003c/svg\u003e\u0027;\n  const cta = \u0027\u003ca class=\"sched-cta\" href=\"https://flybermudair.com/info/schedules\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eView Schedule\u0027 + arrowRight + \u0027\u003c/a\u003e\u0027;\n  document.getElementById(\u0027scheduleWrap\u0027).innerHTML = rows + cta;\n  document.getElementById(\u0027scheduleWrap\u0027).hidden = false;\n  document.getElementById(\u0027scheduleToggle\u0027).setAttribute(\u0027aria-expanded\u0027,\u0027true\u0027);\n}\n\nfunction selectNode(code){\n  currentCode = code;\n  updateMarkerVisuals();\n  drawArcsFor(code, true);\n  renderDetail(code);\n  panelDefault.hidden = true;\n  panelDetail.hidden = false;\n  liveRegion.textContent = \u0027Showing routes for \u0027 + NODES[code].name;\n  if (window.matchMedia(\u0027(max-width:860px)\u0027).matches) expandSheet();\n  panelDetail.scrollTop = 0;\n}\n\nfunction goBack(){\n  currentCode = null;\n  updateMarkerVisuals();\n  clearArcs();\n  panelDefault.hidden = false;\n  panelDetail.hidden = true;\n  liveRegion.textContent = \u0027Showing all destinations\u0027;\n}\n\ndocument.getElementById(\u0027backBtn\u0027).addEventListener(\u0027click\u0027, goBack);\n\ndocument.querySelectorAll(\u0027.dest-tile\u0027).forEach(btn =\u003e {\n  btn.addEventListener(\u0027click\u0027, () =\u003e selectNode(btn.dataset.code));\n  btn.addEventListener(\u0027mouseenter\u0027, () =\u003e previewNode(btn.dataset.code));\n  btn.addEventListener(\u0027mouseleave\u0027, clearPreview);\n});\n\nconst toggleAllBtn = document.getElementById(\u0027toggleAllBtn\u0027);\ntoggleAllBtn.addEventListener(\u0027click\u0027, () =\u003e {\n  const wrap = document.getElementById(\u0027allDestWrap\u0027);\n  const expanded = wrap.hidden;\n  wrap.hidden = !expanded;\n  toggleAllBtn.setAttribute(\u0027aria-expanded\u0027, String(expanded));\n  toggleAllBtn.lastChild.textContent = expanded ? \u0027 Show fewer destinations\u0027 : \u0027 View all destinations\u0027;\n});\n\nconst scheduleToggle = document.getElementById(\u0027scheduleToggle\u0027);\nscheduleToggle.addEventListener(\u0027click\u0027, () =\u003e {\n  const wrap = document.getElementById(\u0027scheduleWrap\u0027);\n  const expanded = wrap.hidden;\n  wrap.hidden = !expanded;\n  scheduleToggle.setAttribute(\u0027aria-expanded\u0027, String(expanded));\n});\n\n/* ===================== Mobile bottom sheet ===================== */\nconst sheetHandle = document.getElementById(\u0027sheetHandle\u0027);\nfunction expandSheet(){\n  panelEl.classList.add(\u0027expanded\u0027);\n  sheetHandle.setAttribute(\u0027aria-expanded\u0027,\u0027true\u0027);\n  sheetHandle.querySelector(\u0027.handle-label\u0027).textContent = \u0027Slide Down To Close\u0027;\n}\nfunction collapseSheet(){\n  panelEl.classList.remove(\u0027expanded\u0027);\n  sheetHandle.setAttribute(\u0027aria-expanded\u0027,\u0027false\u0027);\n  sheetHandle.querySelector(\u0027.handle-label\u0027).textContent = \u0027Slide Up For Details\u0027;\n}\nsheetHandle.addEventListener(\u0027click\u0027, () =\u003e {\n  panelEl.classList.contains(\u0027expanded\u0027) ? collapseSheet() : expandSheet();\n});\n\u003c/script\u003e\n\n\n\u003c/body\u003e\u003c/html\u003e"
  </script>
